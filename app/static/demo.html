<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Appointment Booker Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
        }
        
        .status-dot.active {
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .call-button {
            width: 100%;
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .call-button.start {
            background: #22c55e;
            color: white;
        }
        
        .call-button.end {
            background: #ef4444;
            color: white;
        }
        
        .call-button:hover {
            transform: scale(1.02);
        }
        
        .call-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .conversation {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .message {
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 12px;
            max-width: 80%;
        }
        
        .message.user {
            background: #e0f2fe;
            margin-left: auto;
        }
        
        .message.assistant {
            background: #f0fdf4;
        }
        
        .message-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 4px;
        }
        
        .audio-player {
            margin-top: 8px;
        }
        
        .transcript-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 12px;
        }
        
        .send-button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .send-button:hover {
            background: #2563eb;
        }
        
        .metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .metric {
            text-align: center;
            padding: 16px;
            background: #f8fafc;
            border-radius: 8px;
        }
        
        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: #1e40af;
        }
        
        .metric-label {
            font-size: 12px;
            color: #64748b;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Voice AI Appointment Booker</h1>
        <p class="subtitle">Demo - Text input with audio output</p>
        
        <div class="card">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Ready to start</span>
            </div>
            
            <button class="call-button start" id="startBtn" onclick="startCall()">
                📞 Start Call
            </button>
            <button class="call-button end hidden" id="endBtn" onclick="endCall()">
                📴 End Call
            </button>
        </div>
        
        <div class="card">
            <h3>💬 Conversation</h3>
            <div class="conversation" id="conversation"></div>
            
            <input 
                type="text" 
                class="transcript-input" 
                id="messageInput" 
                placeholder="Type your message here..."
                onkeypress="if(event.key==='Enter')sendMessage()"
            >
            <button class="send-button" onclick="sendMessage()">
                Send Message
            </button>
        </div>
        
        <div class="card">
            <h3>📊 Session Metrics</h3>
            <div class="metrics">
                <div class="metric">
                    <div class="metric-value" id="turnCount">0</div>
                    <div class="metric-label">Conversation Turns</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="callDuration">0:00</div>
                    <div class="metric-label">Duration</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let callActive = false;
        let turnCount = 0;
        let startTime = null;
        let durationInterval = null;
        
        const API_BASE = window.location.origin;
        
        async function startCall() {
            callActive = true;
            turnCount = 0;
            startTime = new Date();
            
            // Update UI
            document.getElementById('startBtn').classList.add('hidden');
            document.getElementById('endBtn').classList.remove('hidden');
            document.getElementById('statusDot').classList.add('active');
            document.getElementById('statusText').textContent = 'Call in progress...';
            
            // Start call session
            await fetch(`${API_BASE}/api/call/start`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({caller_number: 'demo_user'})
            });
            
            // Add greeting
            addMessage('assistant', 'Hello! Thank you for calling. I\'m your appointment assistant. I can help you book, cancel, or reschedule an appointment. How may I help you today?');
            
            // Start duration timer
            durationInterval = setInterval(updateDuration, 1000);
        }
        
        async function endCall() {
            callActive = false;
            clearInterval(durationInterval);
            
            // Update UI
            document.getElementById('startBtn').classList.remove('hidden');
            document.getElementById('endBtn').classList.add('hidden');
            document.getElementById('statusDot').classList.remove('active');
            document.getElementById('statusText').textContent = 'Call ended';
            
            // End call session
            await fetch(`${API_BASE}/api/call/end`, {
                method: 'POST'
            });
        }
        
        async function sendMessage() {
            if (!callActive) {
                alert('Please start a call first');
                return;
            }
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;
            
            // Clear input
            input.value = '';
            
            // Add user message
            addMessage('user', message);
            
            // Send to API
            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        message: message,
                        context: {available_slots: ['Tomorrow 10am', 'Tomorrow 2pm']}
                    })
                });
                
                const data = await response.json();
                
                // Add assistant response
                addMessage('assistant', data.response);
                
                // Play audio if available
                if (data.audio_url) {
                    playAudio(`${API_BASE}${data.audio_url}`);
                }
                
                // Update metrics
                turnCount++;
                document.getElementById('turnCount').textContent = turnCount;
                
            } catch (error) {
                console.error('Error:', error);
                addMessage('assistant', 'Sorry, I encountered an error. Please try again.');
            }
        }
        
        function addMessage(role, text) {
            const conversation = document.getElementById('conversation');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `
                <div class="message-label">${role === 'user' ? '👤 You' : '🤖 AI Assistant'}</div>
                <div class="message-text">${text}</div>
                ${role === 'assistant' ? '<div class="audio-player" id="audioPlayer"></div>' : ''}
            `;
            conversation.appendChild(messageDiv);
            conversation.scrollTop = conversation.scrollHeight;
        }
        
        function playAudio(url) {
            const audio = new Audio(url);
            audio.play();
        }
        
        function updateDuration() {
            if (!startTime) return;
            const elapsed = Math.floor((new Date() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('callDuration').textContent = 
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
